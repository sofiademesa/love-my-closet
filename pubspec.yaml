# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.

name: final_project
description: Love My Closet - a wardrobe rediscovery app (6ADET final project).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Shows the app inside a phone frame in the browser, so it is viewed at the
  # size it was designed for. It stays on in the deployed build on purpose.
  device_preview: ^1.3.1
  # Opens the email client / browser for the About screen's contact links.
  url_launcher: ^6.3.1
  # Choose from Gallery on Add Clothes (works on web too).
  image_picker: ^1.1.2
  # Backend: auth, database, storage. Defaults to the project's public URL and
  # publishable key; override with --dart-define-from-file=env.json.
  supabase_flutter: ^2.8.0
  # Android app only (the web app keeps its own browser versions):
  # the phone camera for Take Photo,
  camera: ">=0.11.0 <0.13.0"
  # and on-device background removal with the same model as the web app.
  flutter_onnxruntime: ^1.6.0
  image: ^4.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Fonts from the design system: Young Serif (headings), DM Sans (body, caption).
  fonts:
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700