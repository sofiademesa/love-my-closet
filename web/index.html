<!DOCTYPE html>
<html>
<head>
  <!-- $FLUTTER_BASE_HREF is replaced at build time by the --base-href flag in
       the deploy workflow. Leave it exactly as it is, or your deployed site
       loads a blank white page. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Love My Closet - made to be loved again">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- browser tab title of the deployed app. -->
  <title>Love My Closet</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Free on-device background removal (no API key, photos stay in the
       browser). See web/bg_removal/THIRD_PARTY_NOTICES.md. -->
  <script src="bg_removal/bg_removal.js" defer></script>
  <!-- Take Photo: opens only the default camera. See web/camera/camera.js. -->
  <script src="camera/camera.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
